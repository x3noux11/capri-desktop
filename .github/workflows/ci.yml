name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node: ['22.12.0', '24']
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  electron-smoke:
    name: Electron / Linux X11
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: npm ci --no-audit --no-fund
      - name: Ensure Electron runtime is installed
        run: node node_modules/electron/install.js
      - name: Configure the Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Start Electron and exercise the renderer and bridge
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:smoke 2>&1 | tee "$RUNNER_TEMP/capri-electron-smoke.log"
      - name: Report Electron failure in the run summary
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/capri-electron-smoke.log" ]]; then
            {
              printf '### Electron smoke test failure\n\n```text\n'
              tail -100 "$RUNNER_TEMP/capri-electron-smoke.log"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'capri-electron-smoke.log'
          if log.exists():
              # Keep the final exception visible: GitHub abbreviates long annotations.
              text = log.read_text(errors='replace')[-3000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Electron smoke test output::{text}')
          PY
